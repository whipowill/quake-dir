// cheat aliases (give needs deathmatch 0, so use the singleplayer alias)
alias giveweap "give 2; give 3; give 4; give 5; give 6; give 7; give 8" // all weapons
alias giveammo "give s 666; give n 666; give r 666; give c 666" // ammo for all of them
alias givekeys "impulse 99" // silver and gold keys (the mod's cheat, blocked in coop)
alias giveall "giveweap; giveammo; givekeys; give a 200" // everything above plus armor
