// gameplay
teamplay 1
deathmatch 1
coop 0
noexit 0
fraglimit 50
skill 3
saved1 0 // bots don't persist between games
sv_cheats 1

// new attack modes
bind mouse2 "impulse 120" // melee attack
bind f "impulse 121" // grenade attack

// new features
bind n "rollmap" // roll new multiplayer map
bind m "impulse 122" // shuffle to new track

// bot keybinds
bind "-" "impulse 110" // add bot
bind "=" "impulse 111" // add bot to other team
bind "BACKSPACE" "impulse 102" // remove bot

// multiplayer map rotation (my choices)
exec maps.cfg

// scarlet awesomeness
exec settings/custom.cfg

// personal settings (excluded from repo)
exec settings.cfg

// engine fixes
scr_centerprintbg 0 // vkquake